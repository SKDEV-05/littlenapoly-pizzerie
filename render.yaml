# Render.com Blueprint for Little Napoli
# Deploys the Laravel API Backend using SQLite (No Credit Card Required)

services:
  # Laravel API Backend Web Service (Docker + SQLite)
  - type: web
    name: little-napoli-backend
    env: docker
    dockerfilePath: apps/backend-laravel/Dockerfile
    dockerContext: apps/backend-laravel
    plan: free
    region: frankfurt # Low latency for Austria & Europe (Frankfurt)
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: "Little Napoli Backend"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        value: "base64:lzj9nkaq/t/LIRriS89COXq3A/wxdC9iEHyeQQ7Cz70="
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: CORS_ALLOWED_ORIGINS
        value: "https://littlenapoli.at,http://localhost:3000,http://127.0.0.1:3000,*"
